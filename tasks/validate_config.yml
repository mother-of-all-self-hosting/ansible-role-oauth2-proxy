---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "oauth2_proxy_container_http_bind_port", "new": "oauth2_proxy_container_http_host_bind_port" }
    - { "old": "oauth2_proxy_systemd_required_systemd_services_list_default", "new": "oauth2_proxy_systemd_required_services_list_default" }
    - { "old": "oauth2_proxy_systemd_required_systemd_services_list_auto", "new": "oauth2_proxy_systemd_required_services_list_auto" }
    - { "old": "oauth2_proxy_systemd_required_systemd_services_list_custom", "new": "oauth2_proxy_systemd_required_services_list_custom" }
    - { "old": "oauth2_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required OAuth2-Proxy settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - oauth2_proxy_uid
    - oauth2_proxy_gid
    - oauth2_proxy_container_network
    - oauth2_proxy_environment_variable_cookie_secret
    - oauth2_proxy_environment_variable_provider
    - oauth2_proxy_environment_variable_client_id
    - oauth2_proxy_environment_variable_client_secret
    - oauth2_proxy_environment_variable_oidc_issuer_url
