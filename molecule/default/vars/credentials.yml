---
# The throwaway secrets that this scenario configures OAuth2-Proxy with.
#
# They live in this file rather than in `molecule.yml`, because Molecule
# expands anything that looks like an environment variable in `molecule.yml`.
# The client secret below carries a dollar sign on purpose - identity providers
# hand out secrets like that, and the value has to survive Ansible, the `env`
# file this role templates and Docker's `--env-file` parsing untouched, which
# is exactly what `verify.yml` ends up confirming when OAuth2-Proxy accepts its
# configuration and starts. `converge.yml` and `verify.yml` read this file with
# `include_vars`, which interpolates nothing.

oauth2_proxy_environment_variable_client_id: oauth2-proxy-molecule-client-id
oauth2_proxy_environment_variable_client_secret: 'oauth2-proxy-molecule$client$secret'

# 32 random bytes, base64-encoded, as the role's own documentation prescribes.
# OAuth2-Proxy refuses to start unless this decodes to 16, 24 or 32 bytes.
oauth2_proxy_environment_variable_cookie_secret: 6EYUB4LQU2AXR7X66DQBEZFOPHIXY6H2WPJ4TAWMHZ4=
