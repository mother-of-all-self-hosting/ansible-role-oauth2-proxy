---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: oauth2-proxy-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        oauth2_proxy_debug_service_enabled: false

        # The port on the host that OAuth2-Proxy is published on, so that
        # `verify.yml` can reach it.
        oauth2_proxy_molecule_bind_port: 4180

        # The throwaway container that plays both the OpenID Connect provider
        # and the protected upstream for this scenario. See `files/stub.py`.
        #
        # It runs on the container network that the role creates, rather than
        # on the test host: Docker 28 and newer block containers on a bridge
        # network from reaching ports published on that bridge's gateway.
        oauth2_proxy_molecule_stub_container_name: oauth2-proxy-molecule-default-stub
        oauth2_proxy_molecule_stub_image: docker.io/python:3.14-alpine
        oauth2_proxy_molecule_stub_path: /oauth2-proxy-molecule
        oauth2_proxy_molecule_stub_oidc_port: 9000
        oauth2_proxy_molecule_stub_upstream_port: 8080

        oauth2_proxy_molecule_issuer_url: "http://{{ oauth2_proxy_molecule_stub_container_name }}:{{ oauth2_proxy_molecule_stub_oidc_port }}"
        oauth2_proxy_molecule_upstream_url: "http://{{ oauth2_proxy_molecule_stub_container_name }}:{{ oauth2_proxy_molecule_stub_upstream_port }}"

        # Prefixes every response the upstream serves. A response carrying it
        # travelled all the way through OAuth2-Proxy; one without it was
        # generated by OAuth2-Proxy itself.
        oauth2_proxy_molecule_upstream_marker: oauth2-proxy-molecule-upstream-reached

        # The path prefix that OAuth2-Proxy is told to let through without
        # authentication, and one that it is not.
        oauth2_proxy_molecule_public_path: /public/resource
        oauth2_proxy_molecule_private_path: /private/resource

        # Variables for OAuth2-Proxy
        oauth2_proxy_uid: 1000
        oauth2_proxy_gid: 1000
        oauth2_proxy_container_labels_traefik_enabled: false
        oauth2_proxy_container_http_host_bind_port: "127.0.0.1:{{ oauth2_proxy_molecule_bind_port }}"

        oauth2_proxy_environment_variable_provider: oidc
        oauth2_proxy_environment_variable_oidc_issuer_url: "{{ oauth2_proxy_molecule_issuer_url }}"
        oauth2_proxy_environment_variable_redirect_url: "http://127.0.0.1:{{ oauth2_proxy_molecule_bind_port }}/oauth2/callback"

        # Three values that OAuth2-Proxy renders into its sign-in page and
        # nowhere else, which is how `verify.yml` establishes that the `env`
        # file this role templates is what the running process is configured
        # from. Deliberately unlike anything OAuth2-Proxy would say on its own.
        oauth2_proxy_environment_variable_provider_display_name: OAuth2-Proxy Molecule Provider
        oauth2_proxy_environment_variable_banner: <p>oauth2-proxy-molecule-banner</p>
        oauth2_proxy_environment_variable_footer: <p>oauth2-proxy-molecule-footer</p>

        # The role has no variables of its own for an upstream or for
        # unauthenticated routes, so these go through its escape hatch for
        # arbitrary settings - which exercises that escape hatch at the same
        # time.
        oauth2_proxy_environment_variables_additional_variables: |
          OAUTH2_PROXY_UPSTREAMS={{ oauth2_proxy_molecule_upstream_url }}
          OAUTH2_PROXY_SKIP_AUTH_ROUTES=^/public/

        # The client credentials and the cookie secret are deliberately NOT
        # defined here. Molecule expands anything looking like an environment
        # variable in this file, and a cookie secret is random base64 which may
        # well contain a dollar sign. `converge.yml` and `verify.yml` read them
        # from `vars/credentials.yml` instead, where nothing interpolates them.
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
